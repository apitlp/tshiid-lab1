name: .NET quality

on:
    push:
    pull_request:

jobs:
    build-and-test:
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 10.0.x
            - run: dotnet restore 2048-dotnet-github-copilot/Game2048.slnx
            - run: dotnet build 2048-dotnet-github-copilot/Game2048.slnx --no-restore
            - run: dotnet test 2048-dotnet-github-copilot/Game2048.slnx --no-build
